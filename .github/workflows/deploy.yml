# Deploys to Vercel using the marketing@comprinno.net account token.
#   main -> Production (comprinno.net)
#   dev  -> Preview    (staging.comprinno.net, aliased after each deploy)
#
# Vercel's native Git integration blocks deployments whose commit author is not
# a Vercel team member, so native auto-deploys are disabled in vercel.json and
# this workflow deploys via the CLI instead.
#
# Required repository secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID

name: Deploy to Vercel

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

# One deployment per branch at a time; a newer push cancels an in-flight one.
concurrency:
  group: vercel-${{ github.ref_name }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_CLI_VERSION: "63.1.0"

jobs:
  deploy:
    name: Deploy ${{ github.ref_name == 'main' && 'production' || 'preview' }}
    if: github.ref_name == 'main' || github.ref_name == 'dev'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
      url: ${{ github.ref_name == 'main' && 'https://comprinno.net' || 'https://staging.comprinno.net' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Vercel CLI
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"

      # Runner-only: re-author HEAD as the Vercel team owner so Vercel accepts
      # the deployment. This amended commit is never pushed; on GitHub the
      # commit keeps its real author. The original author is kept in the message.
      - name: Attribute deployment to team account
        env:
          ORIGINAL_SUBJECT: ${{ github.event.head_commit.message || github.sha }}
        run: |
          SUBJECT="$(printf '%s' "$ORIGINAL_SUBJECT" | head -n 1)"
          git -c user.name="Comprinno Marketing" -c user.email="marketing@comprinno.net" \
            commit --amend --allow-empty --no-verify \
            --author="Comprinno Marketing <marketing@comprinno.net>" \
            -m "[${GITHUB_ACTOR}] ${SUBJECT}"

      - name: Deploy
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            URL="$(vercel deploy --prod --yes --build-env DEPLOY_SHA="$GITHUB_SHA" --token="$VERCEL_TOKEN")"
          else
            # Staging is the built-in Preview environment, aliased to staging.comprinno.net
            URL="$(vercel deploy --yes --build-env DEPLOY_SHA="$GITHUB_SHA" --token="$VERCEL_TOKEN")"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Alias preview to staging domain
        if: github.ref_name != 'main'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel alias set "${{ steps.deploy.outputs.url }}" staging.comprinno.net --token="$VERCEL_TOKEN"

      - name: Verify live site serves this commit
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            SITE="https://comprinno.net"
          else
            SITE="https://staging.comprinno.net"
          fi
          for i in $(seq 1 12); do
            CODE="$(curl -s -o /dev/null -w '%{http_code}' "$SITE/")"
            SHA="$(curl -sI -H 'Cache-Control: no-cache' "$SITE/" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-deploy-sha"{print $2}')"
            echo "attempt $i: HTTP $CODE, live sha=${SHA:-none}, expected=$GITHUB_SHA"
            if [ "$CODE" = "200" ] && [ "$SHA" = "$GITHUB_SHA" ]; then
              echo "Verified: $SITE is serving $GITHUB_SHA"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$SITE is not serving commit $GITHUB_SHA"
          exit 1

      - name: Summary
        run: |
          {
            echo "### Vercel deployment"
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- Deployment: ${{ steps.deploy.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
